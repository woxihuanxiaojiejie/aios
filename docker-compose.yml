services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aios
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - aios_postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios -d aios"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      AIOS_DATABASE_URL: postgresql+psycopg://aios:aios@postgres:5432/aios
      AIOS_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
    command: >
      sh -c "uv run alembic upgrade head &&
      uv run uvicorn aios.api.app:create_default_app --factory --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      AIOS_DATABASE_URL: postgresql+psycopg://aios:aios@postgres:5432/aios
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
    command: >
      sh -c "uv run alembic upgrade head &&
      uv run aios scheduler serve"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  aios_postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${AIOS_POSTGRES_VOLUME_DIR:-/tmp/aios-postgres-data}
