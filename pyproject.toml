[project]
name = "aios"
version = "0.1.0"
description = "AI Decision Operating System minimal kernel"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
    "baostock==0.9.3",
    "python-dotenv>=1.2.2",
    "feedparser>=6.0,<7",
    "trafilatura>=2,<3",
    "tenacity>=8,<10",
    "requests-cache>=1.2,<2",
    "pyrate-limiter>=3,<5",
]

[project.optional-dependencies]
market-data = [
    "akshare>=1.15,<2",
]
market-data-baostock = [
    "baostock>=0.8,<1",
]
llm = [
    "litellm==1.89.0",
]

vibe-trading = [
    "vibe-trading-ai==0.1.11",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "testcontainers[postgres]>=4.8,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aios"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["api_server", "mcp_server", "src", "src.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["akshare", "akshare.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "external_llm: requires real BaoStock and LLM provider network access",
    "external_market: requires real BaoStock market data network access",
    "external_news: requires real RSS/news provider network access",
]
